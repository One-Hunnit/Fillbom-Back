version: '3.8'

services:
  redis:
    image: redis:latest
    container_name: docker_redis
    ports:
      - "6379:6379"
    networks:
      - app-network

  spring-app:
#    build:
#      context: /home/ncp
#      dockerfile: Dockerfile
    container_name: thirsty_robinson
    image: koc2827857/fillbom
    ports:
      - "8080:8080"
    environment:
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    depends_on:
      - redis
    networks:
      - app-network

networks:
  app-network: