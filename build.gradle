plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.3'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'kr.co.onehunnit'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

jar {
    enabled = false
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-web-services'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    //spring security
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    testImplementation 'org.springframework.security:spring-security-test'

    // jwt
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    implementation 'io.jsonwebtoken:jjwt-impl:0.11.5'
    implementation 'io.jsonwebtoken:jjwt-jackson:0.11.5'
    implementation 'com.auth0:java-jwt:4.4.0'

    // jwks
    implementation 'com.auth0:jwks-rsa:0.22.0'

    //swagger
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.0.2'

    //postgreSQL
    implementation 'org.postgresql:postgresql'

    // h2
    runtimeOnly 'com.h2database:h2'

    //google gson
    implementation 'com.google.code.gson:gson'

    //lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    //JTS
    implementation 'org.locationtech.jts:jts-core:1.20.0'

    // Hibernate Spatial
    implementation 'org.hibernate:hibernate-spatial:6.0.0.Final'

    //AWS S3
    implementation 'com.amazonaws:aws-java-sdk-s3:1.12.300'

    //WebSocket
    implementation 'org.springframework.boot:spring-boot-starter-websocket'

    //Redis
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // expo push notification
    implementation 'com.nia-medtech.oss:expo-server-sdk-java:2.0.1'

    //WebClient
    implementation 'org.springframework.boot:spring-boot-starter-webflux'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // redis test
    implementation 'it.ozimov:embedded-redis:0.7.2'

    implementation 'org.hibernate.common:hibernate-commons-annotations:6.0.6.Final'

}

tasks.named('test') {
    useJUnitPlatform()
}

test {
    exclude '**/OAuthServiceTest.class'
}
